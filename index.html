<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><h1>포가든 관리자</h1><p>뼈대 단계입니다. 관리자 로그인과 역할(admin_roles) 확인은 다음 단계에서 붙입니다.</p><p id="status">백엔드 확인 중…</p>
<script>
// 공개(publishable) 키만 사용한다. service_role 키는 이 페이지에 절대 넣지 않는다.
const SUPABASE_URL = "https://rscxzfdnbdmftortrcqt.supabase.co";
const SUPABASE_KEY = "sb_publishable_6GAse3Mlp_cQGukyOiLI7w_tfd4nZDH";
const el = document.getElementById("status");
fetch(SUPABASE_URL + "/rest/v1/rpc/ping", { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: "{}" })
  .then(r => r.json()).then(j => { el.className = "ok"; el.textContent = "백엔드 연결 정상 · 서버 시각 " + j.server_now; })
  .catch(() => { el.className = "bad"; el.textContent = "백엔드 연결 실패"; });
</script></body></html>

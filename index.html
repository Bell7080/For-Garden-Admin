<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>포가든 관리자</title>
<link rel="stylesheet" href="/admin.css">
</head><body>
<section id="login">
  <h1>포가든 관리자</h1><p class="sub">운영 도구 · 허가된 계정만 사용할 수 있습니다.</p>
  <form class="card" id="form" autocomplete="on">
    <label for="email">이메일</label><input id="email" type="email" required autocomplete="username">
    <label for="pw">비밀번호</label><input id="pw" type="password" required autocomplete="current-password">
    <div class="actions"><button class="btn primary" type="submit">로그인</button></div>
    <p class="msg" id="loginMsg" role="status"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><strong>포가든 관리자</strong><span>공지 관리</span><span class="spacer"></span><span id="who"></span><button class="btn ghost" id="logout" type="button">로그아웃</button></header>
  <div class="app">
    <aside class="side">
      <button class="btn primary" id="newNotice" type="button" style="width:100%">+ 새 공지</button>
      <div class="filters">
        <select id="fCat"><option value="">전체 분류</option><option value="notice">공지</option><option value="development">개발 소식</option><option value="event">이벤트</option></select>
        <select id="fStatus"><option value="">전체 상태</option><option value="published">게시됨</option><option value="draft">임시저장</option></select>
      </div>
      <input id="fText" placeholder="제목·주소 검색">
      <div id="list"></div>
    </aside>
    <main class="main">
      <section class="card" id="editor" hidden>
        <div class="row2">
          <div><label>분류</label><select id="category"><option value="notice">공지</option><option value="development">개발 소식</option><option value="event">이벤트</option></select></div>
          <div><label>상태</label><select id="status"><option value="draft">임시저장</option><option value="published">게시</option></select></div>
        </div>
        <div class="row2">
          <div><label>주소(slug) — 만든 뒤에는 바꿀 수 없음</label><input id="slug" maxlength="100" placeholder="영문 소문자·숫자·-"></div>
          <div><label>게시 시각 (이 시각이 지나야 공개)</label><input id="publishedAt" type="datetime-local"></div>
        </div>
        <div class="row2">
          <div><label>템플릿 (새 공지에서 본문 틀을 채움)</label><select id="template"><option value="plain">기본 공지</option><option value="update">업데이트 안내</option><option value="event">이벤트</option></select></div>
          <div><label>상단 고정</label><select id="pinned"><option value="false">아니오</option><option value="true">예 (★ 목록 맨 위)</option></select></div>
        </div>
        <label>대표 이미지 (목록 썸네일 + 팝업 상단)</label>
        <div class="coverbox"><img id="coverImg" alt="" hidden><button class="btn" id="pickCover" type="button">이미지 선택</button><button class="btn ghost" id="clearCover" type="button">제거</button></div>
        <div class="tabs" id="langTabs"></div>
        <div class="card" style="border-top-left-radius:0">
          <label>제목</label><input id="title" maxlength="200">
          <label>요약 (목록 아래 한 줄)</label><input id="summary">
          <label>본문 — 빈 줄로 문단을 나누고, 이미지는 <code>![설명](https://…)</code> 한 줄</label>
          <textarea id="body"></textarea>
          <div class="toolbar"><button class="btn" id="insertImg" type="button">본문에 이미지 넣기</button></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="save" type="button">저장</button>
          <button class="btn" id="dup" type="button">복제</button>
          <button class="btn danger" id="remove" type="button">삭제</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
      </section>
      <section class="pv" id="preview" hidden>
        <h3>미리보기 — 목록에서 보이는 모습</h3>
        <div id="pvRow"></div>
        <h3 style="margin-top:18px">미리보기 — 눌렀을 때 뜨는 팝업</h3>
        <div class="dialog" id="pvDialog"></div>
      </section>
      <p id="empty" style="grid-column:1/-1;color:#72796b">왼쪽에서 공지를 고르거나 새 공지를 만드세요.</p>
    </main>
  </div>
</div>

<div class="modal" id="picker" hidden>
  <div class="box">
    <div class="head">
      <button class="btn" data-tab="upload">업로드</button>
      <button class="btn ghost" data-tab="recent">올린 이미지</button>
      <button class="btn ghost" data-tab="game">포가든 원본</button>
      <select id="gameGroup" hidden></select>
      <span class="spacer"></span><button class="btn ghost" id="closePicker" type="button">닫기</button>
    </div>
    <div class="body" id="pickerBody"></div>
  </div>
</div>
<script type="module" src="/admin.js"></script>
</body></html>

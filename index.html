<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>포가든 관리자</title>
<style>
:root{--paper:#f7f6ee;--ink:#20382d;--muted:#72796b;--yellow:#ead585;--line:#d9dccd;--bad:#a33a2e;--ok:#2f7a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:440px;margin:12vh auto;padding:0 16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);padding:20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
button{margin-top:16px;width:100%;padding:11px;border:0;background:var(--ink);color:var(--yellow);font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.msg{margin-top:14px;font-size:14px;min-height:1.4em}.bad{color:var(--bad)}.ok{color:var(--ok)}
dl{margin:0;font-size:14px}dt{color:var(--muted);margin-top:10px}dd{margin:2px 0 0;word-break:break-all}
[hidden]{display:none}
</style></head><body><main>
<h1>포가든 관리자</h1><p class="sub">운영 도구 · 허가된 계정만 사용할 수 있습니다.</p>
<section class="card" id="login">
  <form id="form" autocomplete="on">
    <label for="email">이메일</label><input id="email" type="email" required autocomplete="username">
    <label for="pw">비밀번호</label><input id="pw" type="password" required autocomplete="current-password">
    <button type="submit">로그인</button>
  </form>
</section>
<section class="card" id="panel" hidden>
  <dl><dt>계정</dt><dd id="who"></dd><dt>관리자 역할</dt><dd id="role"></dd><dt>백엔드 서버 시각</dt><dd id="now"></dd></dl>
  <button class="ghost" id="out" type="button">로그아웃</button>
</section>
<p class="msg" id="msg" role="status"></p>
<script>
// 공개(publishable) 키만 사용한다. service_role 키는 이 페이지에 절대 넣지 않는다.
// 토큰은 메모리에만 두고 저장소(localStorage 등)에 쓰지 않는다 — 새로고침하면 다시 로그인한다.
const URL_ = "https://rscxzfdnbdmftortrcqt.supabase.co";
const KEY = "sb_publishable_6GAse3Mlp_cQGukyOiLI7w_tfd4nZDH";
let token = null;
const $ = id => document.getElementById(id);
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = "msg " + (c || ""); };
const api = (path, body, auth) => fetch(URL_ + path, {
  method: "POST",
  headers: { apikey: KEY, "Content-Type": "application/json", ...(auth ? { Authorization: "Bearer " + auth } : {}) },
  body: JSON.stringify(body || {}),
});
async function show(email) {
  const r = await api("/rest/v1/rpc/is_admin", {}, token);
  const isAdmin = r.ok && (await r.json()) === true;
  if (!isAdmin) { token = null; msg("이 계정은 관리자 권한이 없습니다.", "bad"); return; }
  const roles = await fetch(URL_ + "/rest/v1/admin_roles?select=role", { headers: { apikey: KEY, Authorization: "Bearer " + token } }).then(x => x.json());
  const ping = await api("/rest/v1/rpc/ping", {}, token).then(x => x.json());
  $("who").textContent = email; $("role").textContent = roles.map(x => x.role).join(", ");
  $("now").textContent = ping.server_now;
  $("login").hidden = true; $("panel").hidden = false; msg("");
}
$("form").addEventListener("submit", async e => {
  e.preventDefault(); msg("확인 중…");
  try {
    const r = await api("/auth/v1/token?grant_type=password", { email: $("email").value, password: $("pw").value });
    if (!r.ok) { msg("로그인에 실패했습니다.", "bad"); return; }
    token = (await r.json()).access_token; $("pw").value = "";
    await show($("email").value);
  } catch { msg("백엔드에 연결하지 못했습니다.", "bad"); }
});
$("out").addEventListener("click", () => { token = null; $("panel").hidden = true; $("login").hidden = false; msg(""); });
</script></main></body></html>
